name: Mobile E2E Guard

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    name: Mobile E2E (Review + Account Lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PERSONAL_ACCOUNT_EMAIL: ${{ secrets.E2E_PERSONAL_ACCOUNT_EMAIL }}
      E2E_PERSONAL_ACCOUNT_PASSWORD: ${{ secrets.E2E_PERSONAL_ACCOUNT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cannot use `secrets.*` in step `if:` (workflow validation error). Branch in bash instead.
      - name: Mobile E2E regression guard (skipped if secrets unset)
        run: |
          if [ -z "${E2E_PERSONAL_ACCOUNT_EMAIL:-}" ] || [ -z "${E2E_PERSONAL_ACCOUNT_PASSWORD:-}" ]; then
            echo "::warning::Skipping mobile E2E — add repository secrets E2E_PERSONAL_ACCOUNT_EMAIL and E2E_PERSONAL_ACCOUNT_PASSWORD (same keys as in your local .env; see .env.example)."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e:mobile

      - name: Upload Playwright report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-e2e-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
